<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Invisalign Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0f11;
  --bg2:#16181c;
  --bg3:#1e2025;
  --bg4:#252830;
  --border:#2e3138;
  --border2:#3a3f4a;
  --text:#ecedf0;
  --text2:#9aa0ad;
  --text3:#5e6472;
  --accent:#7ee8c4;
  --warn:#f5c842;
  --danger:#f27575;
  --info:#7eb8f5;
  --radius:12px;
  --radius2:8px;
  --font-body:'DM Sans',sans-serif;
  --font-display:'Fraunces',serif;
  --font-mono:'DM Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;overflow-x:hidden}
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse 60% 40% at 70% 10%,rgba(126,232,196,.06) 0%,transparent 60%),
             radial-gradient(ellipse 40% 30% at 10% 80%,rgba(126,184,245,.04) 0%,transparent 50%);
  pointer-events:none;
}
#root{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:2rem 1.5rem 4rem}
.display{font-family:var(--font-display);font-weight:300;letter-spacing:-.02em}
.mono{font-family:var(--font-mono)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem}
.card-sm{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius2);padding:1rem}
.card-xs{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius2);padding:.6rem .875rem}
button{cursor:pointer;font-family:var(--font-body);font-size:14px;border:none;outline:none;transition:all .15s}
.btn{padding:.45rem 1rem;border-radius:var(--radius2);font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:.35rem;white-space:nowrap}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn:active{transform:translateY(0);filter:brightness(.95)}
.btn-accent{background:var(--accent);color:#0a1a14}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--text2)}
.btn-ghost:hover{background:var(--bg3);border-color:var(--border2)}
.btn-danger{background:rgba(242,117,117,.12);border:1px solid rgba(242,117,117,.3);color:var(--danger)}
.tabs{display:flex;gap:.25rem;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius2);padding:.25rem;width:fit-content}
.tab{padding:.4rem .875rem;border-radius:6px;font-size:13px;font-weight:500;color:var(--text2);background:transparent;border:1px solid transparent}
.tab.active{background:var(--bg2);color:var(--text);border-color:var(--border)}
.tab:hover:not(.active){color:var(--text);background:rgba(255,255,255,.04)}
input[type=date],input[type=number],input[type=text]{
  background:var(--bg3);border:1px solid var(--border);color:var(--text);
  padding:.5rem .75rem;border-radius:var(--radius2);font-family:var(--font-body);font-size:14px;
  outline:none;width:100%;transition:border-color .15s
}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(126,232,196,.1)}
input::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.4) brightness(1.5)}
.field-label{display:block;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.35rem;font-weight:500}
.badge{display:inline-flex;align-items:center;gap:.25rem;padding:.2rem .6rem;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap}
.badge-accent{background:rgba(126,232,196,.12);color:var(--accent);border:1px solid rgba(126,232,196,.2)}
.badge-warn{background:rgba(245,200,66,.12);color:var(--warn);border:1px solid rgba(245,200,66,.2)}
.badge-info{background:rgba(126,184,245,.12);color:var(--info);border:1px solid rgba(126,184,245,.2)}
.badge-muted{background:var(--bg4);color:var(--text3);border:1px solid var(--border)}
.alert{border-radius:var(--radius2);padding:.875rem 1rem;display:flex;align-items:flex-start;gap:.75rem;border:1px solid}
.alert-warn{background:rgba(245,200,66,.07);border-color:rgba(245,200,66,.25)}
.alert-success{background:rgba(126,232,196,.07);border-color:rgba(126,232,196,.2)}
.alert-info{background:rgba(126,184,245,.07);border-color:rgba(126,184,245,.2)}
.progress-track{background:var(--bg3);border-radius:99px;overflow:hidden;height:5px}
.progress-fill{height:100%;border-radius:99px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.ring-wrap{position:relative;flex-shrink:0}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:.6rem .875rem;font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;font-weight:500;border-bottom:1px solid var(--border)}
.tbl td{padding:.7rem .875rem;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:rgba(255,255,255,.02)}
.tbl tr.row-active td{background:rgba(126,232,196,.04)}
.tbl tr.row-done{opacity:.6}
.set-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
@media(max-width:560px){.set-grid{grid-template-columns:repeat(6,1fr)}}
.set-pip{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-family:var(--font-mono);font-weight:500;border:1px solid transparent;transition:all .2s}
.pip-empty{background:var(--bg3);color:var(--text3);border-color:var(--border)}
.pip-cfg{background:rgba(126,184,245,.1);color:var(--info);border-color:rgba(126,184,245,.15)}
.pip-done{background:rgba(126,232,196,.1);color:var(--accent);border-color:rgba(126,232,196,.15)}
.pip-cur{background:rgba(126,232,196,.2);color:var(--accent);border-color:var(--accent);box-shadow:0 0 10px rgba(126,232,196,.2)}
.upcoming-row{display:flex;align-items:center;gap:.875rem;padding:.7rem .875rem;border-radius:var(--radius2);transition:background .1s;border:1px solid transparent}
.upcoming-row:hover{background:var(--bg3)}
.upcoming-row.active-row{background:rgba(126,232,196,.05);border-color:rgba(126,232,196,.1)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.625rem}
@media(max-width:520px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
.stat-item{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius2);padding:.875rem}
.section-gap{display:flex;flex-direction:column;gap:1rem}
.helper{font-size:12px;color:var(--text3);margin-top:.3rem}
.streak-bar{display:flex;gap:4px;flex-wrap:wrap;margin-top:.5rem}
.streak-dot{width:18px;height:18px;border-radius:4px;flex-shrink:0}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fadein{animation:fadein .28s ease both}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
@media(max-width:640px){#root{padding:1rem 1rem 3rem}.card{padding:1.125rem}}
</style>
</head>
<body>
<div id="root"></div>
<script>
// ── Utils ─────────────────────────────────────────────────────────────────────
const KEY="inv-v3";
const pd=s=>{if(!s)return null;const d=new Date(s+"T00:00:00");return isNaN(d)?null:d};
const iso=d=>d.toISOString().split("T")[0];
const addD=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r};
const diff=(a,b)=>Math.round((+b-+a)/86400000);
const tod0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const fmt=d=>d?d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):"—";
const fmts=d=>d?d.toLocaleDateString("en-US",{month:"short",day:"numeric"}):"—";

// ── Storage ───────────────────────────────────────────────────────────────────
const store={
  get:()=>{try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):null}catch{return null}},
  set:v=>{try{localStorage.setItem(KEY,JSON.stringify(v))}catch{}}
};
const INIT={startDate:"",groups:[],changed:{},notes:{}};

// ── Compute sets ──────────────────────────────────────────────────────────────
function computeSets(cfg){
  const arr=Array.from({length:24},(_,i)=>({id:i+1,days:null,start:null,end:null}));
  for(const g of cfg.groups)
    for(let i=g.from-1;i<Math.min(g.to,24);i++)arr[i].days=g.days;
  if(cfg.startDate){
    let cur=pd(cfg.startDate);
    for(let i=0;i<24;i++){
      if(!cur||!arr[i].days){if(!arr[i].days&&cur){}else cur=null;continue;}
      arr[i].start=new Date(cur);
      arr[i].end=addD(cur,arr[i].days-1);
      cur=addD(cur,arr[i].days);
    }
  }
  return arr;
}

// ── DOM helpers ───────────────────────────────────────────────────────────────
function h(tag,attrs={},...kids){
  const el=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){
    if(k==="class")el.className=v;
    else if(k.startsWith("on"))el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="style"&&typeof v==="object")Object.assign(el.style,v);
    else el.setAttribute(k,v);
  }
  for(const c of kids.flat(Infinity)){
    if(c==null||c===false)continue;
    if(typeof c==="string"||typeof c==="number")el.appendChild(document.createTextNode(c));
    else el.appendChild(c);
  }
  return el;
}
function hsvg(html){const d=document.createElement("div");d.innerHTML=html;return d.firstChild}

// ── Ring SVG ──────────────────────────────────────────────────────────────────
function Ring({pct,size=112,thick=9,color="var(--accent)"}){
  const r=(size-thick)/2,c=2*Math.PI*r,fill=c*Math.min(Math.max(pct,0),1);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--bg4)" stroke-width="${thick}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${thick}"
      stroke-dasharray="${fill} ${c}" stroke-linecap="round" style="transition:stroke-dasharray .8s ease"/>
  </svg>`;
}

// ── State ─────────────────────────────────────────────────────────────────────
let state={cfg:INIT,tab:"dash",gf:{from:"",to:"",days:""},editIdx:null,now:tod0()};
function loadState(){const s=store.get();if(s)state.cfg={...INIT,...s};}

function saveState(next){state.cfg=next;store.set(next);render();}
function setState(p){Object.assign(state,p);render();}

// ── Derived ───────────────────────────────────────────────────────────────────
function getDerived(){
  const{cfg,now:NOW}=state;
  const sets=computeSets(cfg);
  const cur=sets.find(s=>s.start&&s.end&&NOW>=s.start&&NOW<=s.end)||null;
  const nextSet=cur?sets[cur.id]:null;
  const daysIn=cur?diff(cur.start,NOW)+1:0;
  const daysLeft=cur?diff(NOW,cur.end):0;
  const ringPct=cur?.days?daysIn/cur.days:0;
  const changeToday=daysLeft===0&&!!cur;
  const changeTomorrow=daysLeft===1&&!!cur;
  const isChanged=cur?!!(cfg.changed?.[cur.id]):false;
  const completedCount=sets.filter(s=>s.end&&NOW>s.end).length;
  const configuredCount=sets.filter(s=>s.days!==null).length;
  const totalDays=sets.reduce((a,s)=>a+(s.days||0),0);
  const firstStart=cfg.startDate?pd(cfg.startDate):null;
  const daysInTreatment=firstStart?Math.max(0,diff(firstStart,NOW)):0;
  const lastCfg=[...sets].reverse().find(s=>s.end);
  const estEnd=lastCfg?.end||null;
  const overallPct=totalDays>0&&firstStart?Math.min(1,daysInTreatment/totalDays):0;
  const upcoming=sets.filter(s=>s.start&&s.end&&s.end>=NOW).slice(0,6);
  const changedCount=Object.keys(cfg.changed||{}).length;
  // compliance streak
  const streak=(()=>{
    let s=0;
    for(let i=completedCount-1;i>=0;i--){if(cfg.changed?.[sets[i]?.id])s++;else break;}
    return s;
  })();
  return{sets,cur,nextSet,daysIn,daysLeft,ringPct,changeToday,changeTomorrow,isChanged,
    completedCount,configuredCount,totalDays,firstStart,daysInTreatment,estEnd,overallPct,upcoming,streak,changedCount};
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
function renderDash(d){
  const{cfg,now:NOW}=state;
  const{sets,cur,nextSet,daysIn,daysLeft,ringPct,changeToday,changeTomorrow,isChanged,
    completedCount,configuredCount,totalDays,daysInTreatment,estEnd,overallPct,upcoming,streak,changedCount}=d;
  const frag=document.createDocumentFragment();

  // Alert banner
  if(changeToday&&!isChanged){
    frag.appendChild(h("div",{class:"alert alert-warn fadein"},
      h("div",{style:{fontSize:"1.3rem"}},"⚠️"),
      h("div",{},
        h("div",{style:{fontWeight:"600",color:"var(--warn)",marginBottom:".15rem"}},`Time to change! — Set ${cur.id} ends today`),
        h("div",{style:{fontSize:"13px",color:"var(--warn)",opacity:".85"}},
          nextSet?.start?`Switch to Set ${cur.id+1} today. It runs until ${fmts(nextSet.end)}.`:`Switch to Set ${cur.id+1} today.`)
      )
    ));
  } else if(changeToday&&isChanged){
    frag.appendChild(h("div",{class:"alert alert-success fadein"},
      h("div",{style:{fontSize:"1.3rem"}},"✅"),
      h("div",{style:{fontWeight:"600",color:"var(--accent)"}},`Set ${cur.id} complete! You've moved to Set ${cur.id+1}. Great work!`)
    ));
  } else if(changeTomorrow){
    frag.appendChild(h("div",{class:"alert alert-info fadein"},
      h("div",{style:{fontSize:"1.2rem"}},"📅"),
      h("div",{style:{fontSize:"14px",color:"var(--info)"}},
        "Heads up — change aligners ",h("strong",{},"tomorrow"),` (Set ${cur.id} → Set ${cur.id+1})`)
    ));
  }

  // Hero card
  if(cur){
    const ringColor=changeToday?"var(--warn)":"var(--accent)";
    frag.appendChild(h("div",{class:"card fadein"},
      h("div",{style:{display:"flex",gap:"1.5rem",alignItems:"center",flexWrap:"wrap"}},
        h("div",{class:"ring-wrap"},
          hsvg(Ring({pct:ringPct,size:112,thick:9,color:ringColor})),
          h("div",{class:"ring-label"},
            h("span",{class:"mono",style:{fontSize:"2rem",fontWeight:"500",lineHeight:"1",color:ringColor}},String(cur.id)),
            h("span",{style:{fontSize:"11px",color:"var(--text3)"}},"of 24")
          )
        ),
        h("div",{style:{flex:"1",minWidth:"200px"}},
          h("div",{style:{display:"flex",alignItems:"center",gap:".5rem",marginBottom:".625rem",flexWrap:"wrap"}},
            h("h2",{class:"display",style:{fontSize:"1.5rem",fontWeight:"300"}},`Set ${cur.id}`),
            h("span",{class:`badge ${isChanged?"badge-accent":changeToday?"badge-warn":"badge-info"}`},
              isChanged?"✓ Changed":changeToday?"Change today!":"● Active")
          ),
          h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:".5rem",marginBottom:".875rem"}},
            ...[["Day in set",`${daysIn} / ${cur.days}`,false],
               ["Days left",`${daysLeft}`,daysLeft<=2],
               ["Change date",fmts(cur.end),changeToday]
            ].map(([label,val,warn])=>
              h("div",{class:"card-xs"},
                h("div",{style:{fontSize:"11px",color:"var(--text3)",marginBottom:".2rem"}},label),
                h("div",{class:"mono",style:{fontSize:"15px",fontWeight:"500",color:warn?"var(--warn)":"var(--text)"}},val)
              )
            )
          ),
          h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:".5rem"}},
            h("span",{style:{fontSize:"12px",color:"var(--text3)"}},`${fmts(cur.start)} → ${fmts(cur.end)}`),
            h("button",{
              class:`btn ${isChanged?"btn-ghost":"btn-accent"}`,
              onClick:()=>{
                const ch={...(cfg.changed||{})};
                if(ch[cur.id])delete ch[cur.id];else ch[cur.id]=iso(NOW);
                saveState({...cfg,changed:ch});
              }
            },isChanged?"✕  Unmark changed":"✓  Mark as changed")
          )
        )
      )
    ));

    // Next set preview
    if(nextSet&&nextSet.start){
      frag.appendChild(h("div",{class:"card-xs fadein",style:{display:"flex",alignItems:"center",gap:".75rem",flexWrap:"wrap"}},
        h("span",{style:{fontSize:"12px",color:"var(--text3)"}},"Next up:"),
        h("span",{class:"mono",style:{fontSize:"13px",fontWeight:"500"}},`Set ${nextSet.id}`),
        h("span",{class:"badge badge-muted"},`${nextSet.days}d`),
        h("span",{style:{fontSize:"12px",color:"var(--text2)"}},`${fmts(nextSet.start)} → ${fmts(nextSet.end)}`)
      ));
    }
  } else {
    const allDone=completedCount>=configuredCount&&configuredCount>0;
    frag.appendChild(h("div",{class:"card fadein",style:{textAlign:"center",padding:"2.5rem 1.5rem"}},
      h("div",{style:{fontSize:"3rem",marginBottom:".75rem"}},allDone?"🏆":configuredCount>0?"📅":"🦷"),
      h("h3",{class:"display",style:{fontSize:"1.5rem",fontWeight:"300",marginBottom:".5rem"}},
        allDone?"Treatment complete!":configuredCount>0?"Setup required":"Welcome"),
      h("p",{style:{color:"var(--text2)",fontSize:"13px",marginBottom:"1rem"}},
        allDone?`All ${completedCount} sets finished. Congratulations! 🎉`:
        configuredCount>0?"Add your aligner groups and a start date to begin.":
        "Configure your 24 aligner sets to start tracking."),
      !allDone&&h("button",{class:"btn btn-accent",onClick:()=>setState({tab:"setup"})},"Go to Setup →")
    ));
  }

  // Overall progress
  frag.appendChild(h("div",{class:"card fadein"},
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:".75rem"}},
      h("div",{style:{fontWeight:"500",fontSize:"14px"}},"Overall progress"),
      h("div",{class:"mono",style:{fontSize:"14px",color:"var(--accent)"}},`${Math.round(overallPct*100)}%`)
    ),
    h("div",{class:"progress-track",style:{marginBottom:"1rem"}},
      h("div",{class:"progress-fill",style:{width:`${overallPct*100}%`,background:"var(--accent)"}})
    ),
    h("div",{class:"stat-grid"},
      ...[["Sets done",`${completedCount}/24`],["Days in tx",daysInTreatment?`${daysInTreatment}d`:"—"],
          ["Total days",totalDays?`${totalDays}d`:"—"],["Est. finish",estEnd?fmts(estEnd):"—"]
      ].map(([label,val])=>
        h("div",{class:"stat-item"},
          h("div",{style:{fontSize:"11px",color:"var(--text3)",marginBottom:".25rem"}},label),
          h("div",{class:"mono",style:{fontSize:"15px",fontWeight:"500"}},val)
        )
      )
    )
  ));

  // Compliance / streak
  if(completedCount>0){
    const completedSets=sets.filter(s=>s.end);
    const dots=completedSets.map(s=>{
      const changed=!!(cfg.changed?.[s.id]);
      return h("div",{
        class:"streak-dot",
        title:`Set ${s.id}: ${changed?"Changed ✓":"Not marked"}`,
        style:{background:changed?"var(--accent)":"var(--bg4)",border:`1px solid ${changed?"rgba(126,232,196,.3)":"var(--border)"}`}
      });
    });
    frag.appendChild(h("div",{class:"card fadein"},
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:".375rem",flexWrap:"wrap",gap:".5rem"}},
        h("div",{style:{fontWeight:"500",fontSize:"14px"}},"Change compliance"),
        streak>0?h("span",{class:"badge badge-warn"},`🔥 ${streak} in a row`):null
      ),
      h("div",{style:{fontSize:"12px",color:"var(--text3)",marginBottom:".625rem"}},
        `${changedCount} of ${completedCount} completed sets marked changed`),
      h("div",{class:"streak-bar"},...dots)
    ));
  }

  // Upcoming changes
  if(upcoming.length>1){
    frag.appendChild(h("div",{class:"card fadein"},
      h("h3",{style:{fontSize:"14px",fontWeight:"500",marginBottom:".75rem"}},"Upcoming changes"),
      h("div",{style:{display:"flex",flexDirection:"column",gap:".25rem"}},
        ...upcoming.map(s=>{
          const du=diff(NOW,s.end),isCur=cur?.id===s.id;
          return h("div",{class:`upcoming-row${isCur?" active-row":""}`},
            h("div",{class:"mono",style:{width:"28px",textAlign:"center",fontWeight:"500",color:isCur?"var(--accent)":"var(--text2)",fontSize:"15px"}},s.id),
            h("div",{style:{flex:"1",fontSize:"13px"}},
              h("span",{style:{fontWeight:"500"}},`Set ${s.id}`),
              h("span",{style:{color:"var(--text3)",marginLeft:".35rem"}},`→ change ${fmts(s.end)}`)
            ),
            h("div",{class:"mono",style:{fontSize:"12px",color:du<=2?"var(--warn)":"var(--text3)"}},
              isCur?(daysLeft===0?"today!":`${daysLeft}d left`):`in ${du}d`)
          );
        })
      )
    ));
  }

  return frag;
}

// ── Timeline ──────────────────────────────────────────────────────────────────
function renderTimeline(d){
  const{cfg,now:NOW}=state;
  const{sets,cur}=d;
  const frag=document.createDocumentFragment();
  let filter="all";
  const tbody=document.createElement("tbody");

  function buildRows(){
    tbody.innerHTML="";
    sets.forEach(s=>{
      const isPast=s.end&&NOW>s.end;
      const isCur=cur?.id===s.id;
      const isUp=s.start&&s.end&&!isPast&&!isCur;
      if(filter==="completed"&&!isPast)return;
      if(filter==="upcoming"&&!isUp&&!isCur)return;
      const ch=!!(cfg.changed?.[s.id]);
      const row=document.createElement("tr");
      row.className=isCur?"row-active":isPast?"row-done":"";
      const status=!s.start?"Not set":isPast?"Done":isCur?"Active":"Upcoming";
      const statusBadge=status==="Active"?`<span class="badge badge-accent">● Active</span>`
        :status==="Done"?`<span class="badge badge-muted">✓ Done</span>`
        :status==="Upcoming"?`<span class="badge badge-info">Upcoming</span>`
        :`<span class="badge badge-muted" style="color:var(--text3)">Not set</span>`;
      const note=cfg.notes?.[s.id]||"";
      row.innerHTML=`
        <td><span class="mono" style="font-size:15px;font-weight:500;color:${isCur?"var(--accent)":isPast?"var(--text3)":"var(--text)"}">${s.id}</span></td>
        <td><span class="mono">${s.days?s.days+"d":"—"}</span></td>
        <td style="color:var(--text2);white-space:nowrap">${s.start?fmts(s.start):"—"}</td>
        <td style="white-space:nowrap;color:${isCur?"var(--accent)":"var(--text2)"}">${s.end?fmts(s.end):"—"}</td>
        <td>${statusBadge}</td>
        <td>${isPast||isCur?`<button class="btn btn-ghost" style="padding:.2rem .55rem;font-size:11px;${ch?"background:rgba(126,232,196,.08);border-color:rgba(126,232,196,.3);color:var(--accent)":""}" data-toggle="${s.id}">${ch?"✓ Done":"Mark"}</button>`:`<span style="color:var(--text3)">—</span>`}</td>
        <td><input type="text" value="${note.replace(/"/g,'&quot;')}" placeholder="Add note…" style="width:130px;padding:.25rem .5rem;font-size:12px" data-note="${s.id}"/></td>`;
      tbody.appendChild(row);
    });
    tbody.querySelectorAll("[data-toggle]").forEach(btn=>{
      btn.addEventListener("click",()=>{
        const id=parseInt(btn.dataset.toggle);
        const ch2={...(cfg.changed||{})};
        if(ch2[id])delete ch2[id];else ch2[id]=iso(NOW);
        saveState({...cfg,changed:ch2});
      });
    });
    tbody.querySelectorAll("[data-note]").forEach(inp=>{
      inp.addEventListener("change",()=>{
        const id=parseInt(inp.dataset.note);
        const notes2={...(cfg.notes||{}),[id]:inp.value};
        saveState({...cfg,notes:notes2});
      });
    });
  }

  const filterBtns=["All","Upcoming","Completed"].map(lbl=>{
    const isActive=lbl.toLowerCase()===filter;
    const btn=h("button",{
      class:`btn btn-ghost`,
      style:isActive?"background:var(--bg3);border-color:var(--border2);color:var(--text)":"",
      onClick:()=>{
        filter=lbl.toLowerCase();
        filterBtns.forEach(b=>{b.style.background="";b.style.color="";b.style.borderColor="";});
        btn.style.background="var(--bg3)";btn.style.color="var(--text)";btn.style.borderColor="var(--border2)";
        buildRows();
      }
    },lbl);
    return btn;
  });

  buildRows();
  frag.appendChild(h("div",{class:"card fadein"},
    h("h3",{style:{fontSize:"14px",fontWeight:"500",marginBottom:".75rem"}},"All 24 aligner sets"),
    h("div",{style:{display:"flex",gap:".375rem",marginBottom:".875rem",flexWrap:"wrap"}},...filterBtns),
    h("div",{style:{overflowX:"auto"}},
      h("table",{class:"tbl"},
        h("thead",{},h("tr",{},
          ...["#","Days","Start","Change date","Status","Changed","Notes"].map(lbl=>h("th",{},lbl))
        )),
        tbody
      )
    )
  ));
  return frag;
}

// ── Setup ─────────────────────────────────────────────────────────────────────
function renderSetup(d){
  const{cfg}=state;
  const{sets,cur}=d;
  const frag=document.createDocumentFragment();

  // Start date
  frag.appendChild(h("div",{class:"card fadein"},
    h("h3",{style:{fontSize:"14px",fontWeight:"500",marginBottom:".3rem"}},"Treatment start date"),
    h("p",{class:"helper",style:{marginBottom:".875rem"}},"The first day you put in Set 1."),
    h("div",{style:{display:"flex",gap:".5rem",alignItems:"center",maxWidth:"260px"}},
      (()=>{
        const inp=h("input",{type:"date",value:cfg.startDate});
        inp.addEventListener("change",e=>saveState({...cfg,startDate:e.target.value}));
        return inp;
      })(),
      cfg.startDate?h("span",{style:{color:"var(--accent)",fontSize:"1.1rem"}},"✓"):null
    )
  ));

  // Groups
  frag.appendChild(h("div",{class:"card fadein"},
    h("h3",{style:{fontSize:"14px",fontWeight:"500",marginBottom:".3rem"}},"Aligner groups"),
    h("p",{class:"helper",style:{marginBottom:"1rem"}},"Assign the same wear duration to a range of sets. Dates chain automatically from your start date."),

    // Form
    (()=>{
      const wrap=h("div",{class:"card-sm",style:{marginBottom:"1rem"}});
      wrap.appendChild(h("div",{style:{fontSize:"13px",fontWeight:"500",marginBottom:".75rem"}},state.editIdx!==null?"Edit group":"Add group"));
      const grid=h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr auto",gap:".625rem",alignItems:"end"}});
      const inputs={};
      for(const[key,label,ph,mn,mx]of[["from","From set","1",1,24],["to","To set","4",1,24],["days","Days each","14",1,90]]){
        const div=h("div",{});
        div.appendChild(h("label",{class:"field-label"},label));
        const inp=h("input",{type:"number",min:String(mn),max:String(mx),placeholder:ph,value:state.gf[key]});
        inp.addEventListener("input",e=>{state.gf[key]=e.target.value;});
        inputs[key]=inp;
        div.appendChild(inp);
        grid.appendChild(div);
      }
      const bwrap=h("div",{style:{display:"flex",gap:".375rem"}});
      const addBtn=h("button",{class:"btn btn-accent",onClick:()=>{
        const from=parseInt(inputs.from.value),to=parseInt(inputs.to.value),days=parseInt(inputs.days.value);
        if(!from||!to||!days||from>to||from<1||to>24||days<1){
          const orig=addBtn.textContent;addBtn.textContent="Check values";
          setTimeout(()=>addBtn.textContent=orig,1500);return;
        }
        let groups=[...cfg.groups];
        if(state.editIdx!==null){groups[state.editIdx]={from,to,days};state.editIdx=null;}
        else groups.push({from,to,days});
        groups.sort((a,b)=>a.from-b.from);
        state.gf={from:"",to:"",days:""};
        saveState({...cfg,groups});
      }},state.editIdx!==null?"Save":"+ Add");
      bwrap.appendChild(addBtn);
      if(state.editIdx!==null){
        bwrap.appendChild(h("button",{class:"btn btn-ghost",onClick:()=>{state.editIdx=null;state.gf={from:"",to:"",days:""};render();}},"✕"));
      }
      grid.appendChild(bwrap);
      wrap.appendChild(grid);
      return wrap;
    })(),

    // List
    cfg.groups.length===0
      ?h("div",{style:{textAlign:"center",padding:"1.25rem",color:"var(--text3)",fontSize:"13px",border:"1px dashed var(--border)",borderRadius:"var(--radius2)"}},"No groups yet — add one above.")
      :h("div",{style:{display:"flex",flexDirection:"column",gap:".375rem"}},
        ...cfg.groups.map((g,i)=>
          h("div",{class:"card-xs",style:{display:"flex",alignItems:"center",gap:".75rem",flexWrap:"wrap"}},
            h("span",{class:"badge badge-info"},`Sets ${g.from}–${g.to}`),
            h("span",{style:{flex:"1",fontSize:"13px"}},
              h("strong",{},g.days)," days each ",
              h("span",{style:{color:"var(--text3)"}},`· ${(g.to-g.from+1)*g.days} days total`)
            ),
            h("button",{class:"btn btn-ghost",style:{padding:".25rem .6rem",fontSize:"12px"},onClick:()=>{
              state.gf={from:String(g.from),to:String(g.to),days:String(g.days)};
              state.editIdx=i;render();
            }},"Edit"),
            h("button",{class:"btn btn-danger",style:{padding:".25rem .6rem",fontSize:"12px"},onClick:()=>{
              saveState({...cfg,groups:cfg.groups.filter((_,idx)=>idx!==i)});
            }},"Delete")
          )
        )
      ),

    // Coverage map
    cfg.groups.length>0&&h("div",{style:{marginTop:"1rem"}},
      h("div",{style:{fontSize:"11px",color:"var(--text3)",textTransform:"uppercase",letterSpacing:".07em",marginBottom:".5rem"}},"Coverage map"),
      h("div",{class:"set-grid"},
        ...sets.map(s=>{
          const st=s.days?(s.start?(state.now>s.end?"done":cur?.id===s.id?"cur":"cfg"):"cfg"):"empty";
          return h("div",{class:`set-pip pip-${st}`,title:`Set ${s.id}: ${s.days?s.days+"d":"not set"}`},String(s.id));
        })
      ),
      h("div",{style:{display:"flex",gap:".875rem",marginTop:".625rem",flexWrap:"wrap"}},
        ...([["pip-done","Completed"],["pip-cur","Active"],["pip-cfg","Configured"],["pip-empty","Not set"]]).map(([cls,lbl])=>
          h("div",{style:{display:"flex",alignItems:"center",gap:".35rem",fontSize:"11px",color:"var(--text3)"}},
            h("div",{class:`set-pip ${cls}`,style:{width:"12px",height:"12px",borderRadius:"3px",flexShrink:"0"}}),lbl)
        )
      )
    )
  ));

  // Reset
  frag.appendChild(h("div",{class:"card fadein",style:{border:"1px solid rgba(242,117,117,.2)",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:".75rem"}},
    h("div",{},
      h("div",{style:{fontWeight:"500",marginBottom:".25rem"}},"Reset all data"),
      h("div",{style:{fontSize:"13px",color:"var(--text2)"}},"Clear all configuration and start fresh.")
    ),
    h("button",{class:"btn btn-danger",onClick:()=>{
      if(confirm("Reset all data? This cannot be undone.")){
        state.gf={from:"",to:"",days:""};state.editIdx=null;
        saveState(INIT);
      }
    }},"Reset")
  ));

  return frag;
}

// ── Main render ───────────────────────────────────────────────────────────────
function render(){
  const{cfg,tab}=state;
  const d=getDerived();
  const root=document.getElementById("root");
  root.innerHTML="";

  // Header
  const header=h("div",{style:{marginBottom:"1.5rem"}},
    h("div",{style:{display:"flex",alignItems:"flex-start",justifyContent:"space-between",flexWrap:"wrap",gap:".75rem",marginBottom:"1rem"}},
      h("div",{},
        h("div",{style:{display:"flex",alignItems:"center",gap:".75rem",marginBottom:".25rem"}},
          h("span",{style:{fontSize:"1.75rem"}},"🦷"),
          h("h1",{class:"display",style:{fontSize:"1.75rem",fontWeight:"300"}},"Invisalign Tracker")
        ),
        h("p",{style:{fontSize:"12px",color:"var(--text3)"}},
          `${d.configuredCount}/24 sets configured · ${d.completedCount} done · ${d.totalDays} total days`)
      ),
      d.estEnd&&h("div",{class:"card-xs",style:{textAlign:"right"}},
        h("div",{style:{fontSize:"10px",color:"var(--text3)",textTransform:"uppercase",letterSpacing:".07em",marginBottom:".2rem"}},"Est. finish"),
        h("div",{class:"mono",style:{fontSize:"14px",fontWeight:"500"}},fmt(d.estEnd))
      )
    ),
    h("div",{class:"tabs"},
      ...([["dash","Dashboard"],["timeline","Timeline"],["setup","Setup"]]).map(([id,label])=>
        h("button",{class:`tab${tab===id?" active":""}`,onClick:()=>setState({tab:id})},label)
      )
    )
  );
  root.appendChild(header);

  const content=h("div",{class:"section-gap"});
  if(tab==="dash")content.appendChild(renderDash(d));
  else if(tab==="timeline")content.appendChild(renderTimeline(d));
  else content.appendChild(renderSetup(d));
  root.appendChild(content);
}

// ── Boot ──────────────────────────────────────────────────────────────────────
loadState();
render();
setInterval(()=>{state.now=tod0();render();},60000);
</script>
</body>
